# AIJudge 应用编排 (Linux / Windows Docker Desktop 通用)
# 用法:
#   docker build -f docker/judge.Dockerfile.cn -t aijudge-judge:latest .   # 先构建判题镜像
#   docker compose -f docker/docker-compose.yml up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    image: aijudge-app:latest
    container_name: aijudge-app
    ports:
      - "443:443"
    volumes:
      - ../data:/app/data
      - ../certs:/app/certs
      - /var/run/docker.sock:/var/run/docker.sock
      # Let's Encrypt 证书目录 (可选: 未配置 certbot 的机器上为空目录, 无影响)
      - /etc/letsencrypt:/etc/letsencrypt:ro
    env_file:
      - ../.env
    environment:
      PORT: "443"
      TLS_ENABLED: "1"
      JUDGE_IMAGE: "aijudge-judge:latest"
    restart: unless-stopped
